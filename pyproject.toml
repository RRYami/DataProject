[project]
name = "dataproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.4.1",
    "fastapi[standard]>=0.123.9",
    "pendulum>=3.1.0",
    "polars>=1.34.0",
    "polygon-api-client>=1.16.2",
    "prometheus-client>=0.21.1",
    "pyarrow>=22.0.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "rich>=13.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --cov=api --cov=ELT --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
omit = ["tests/*", ".venv/*", "*/migrations/*"]

[tool.ruff]
line-length = 80

[tool.uv.workspace]
members = [
    "powershell",
]
