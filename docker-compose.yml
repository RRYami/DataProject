# Docker Compose Configuration for DataProject Monitoring Stack
# This sets up FastAPI + Prometheus + Grafana
#
# METRICS BEHAVIOR:
# - Prometheus data is EPHEMERAL (not persisted to volumes)
# - Every restart gives you fresh metrics starting from zero
# - Perfect for testing and development scenarios
# - Grafana settings ARE PERSISTED (passwords, dashboards, etc.)
# - Database data IS PERSISTED (your financial data is safe)

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataproject-api
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/database/polygon.duckdb
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - FRED_KEY=${FRED_KEY}
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./secret:/app/secret:ro
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Prometheus Server
  # NOTE: No volume mount for /prometheus directory
  # This makes metrics ephemeral - fresh data on every container restart
  # Perfect for testing without historical clutter
  prometheus:
    image: prom/prometheus:latest
    container_name: dataproject-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # No volume mount here = ephemeral metrics storage
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - api

  # Grafana Server
  # Grafana data IS persisted to maintain settings, passwords, and dashboard customizations
  grafana:
    image: grafana/grafana:latest
    container_name: dataproject-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana  # Persistent volume for Grafana settings
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  # Only Grafana data is persisted
  # Prometheus metrics are ephemeral (stored in container, cleared on restart)
  grafana-data:
    driver: local
