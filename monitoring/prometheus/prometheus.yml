# Prometheus Configuration for DataProject API
global:
  scrape_interval: 15s      # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'dataproject-monitor'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # DataProject FastAPI application
  - job_name: 'dataproject-api'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/monitoring/metrics'
    static_configs:
      - targets: ['api:8000']  # 'api' is the Docker service name
        labels:
          service: 'dataproject-api'
          environment: 'development'
